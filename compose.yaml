services:
  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: chat_translation
      POSTGRES_USER: chat_translation
      POSTGRES_PASSWORD: chat_translation_password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U chat_translation -d chat_translation
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./services/backend
      dockerfile: Dockerfile.dev
    env_file:
      - ./environment/backend.env
    ports:
      - "8000:8000"
    volumes:
      - ./services/backend/app:/app/app
      - ./services/backend/scripts:/app/scripts
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/health')
      interval: 5s
      timeout: 3s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: services/frontend/Dockerfile.dev
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "5173:5173"
    volumes:
      - ./services/frontend/index.html:/app/services/frontend/index.html
      - ./services/frontend/public:/app/services/frontend/public
      - ./services/frontend/src:/app/services/frontend/src
      - ./services/frontend/vite.config.ts:/app/services/frontend/vite.config.ts
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres-data:
